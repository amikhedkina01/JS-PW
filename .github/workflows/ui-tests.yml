name: UI Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [dev, stage] # середовища
        browser: [chromium, firefox] # браузери

    env:
      ENV_NAME: ${{ matrix.env }} # підхопить data/.{env}.js
      BROWSER: ${{ matrix.browser }}# наш варіант без devices
      # прод-секрети (за потреби) -> налаштуй у repo settings → Secrets
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PASS: ${{ secrets.PROD_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test
        # або: node scripts/run-tests.js ${{ matrix.env }}

      - name: Generate Allure report
        if: always() # генерувати навіть якщо тести падали
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.env }}-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.env }}-${{ matrix.browser }}
          path: allure-report
          if-no-files-found: ignore
          retention-days: 14
